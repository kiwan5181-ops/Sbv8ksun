name: Build Strombreaker KSU Next Surya
on:
  push:
    branches: [ "Sbv8ksun" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Alat Kerja Lengkap
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev clang lld git rsync

      - name: Download AOSP Clang Terkalibrasi (Anti-Gagal)
        run: |
          mkdir -p $GITHUB_WORKSPACE/aosp-clang
          # Tarik Clang 17 khusus Android yang kompatibel penuh dengan Strombreaker V8
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r498229b $GITHUB_WORKSPACE/aosp-clang

      - name: Ambil Source Strombreaker Lo
        run: |
          git clone --depth=1 https://github.com/kiwan5181-ops/Sbv8ksun.git -b Sbv8ksun kernel-source

      - name: Pasang KernelSU Next Manual-Otomatis
        run: |
          cd kernel-source
          git submodule add https://github.com/rifsxd/KernelSU-Next.git KernelSU-Next
          echo "obj-y += KernelSU-Next/kernel/" >> drivers/Makefile

      - name: Aktifkan KSU Next ke Surya Defconfig
        run: |
          cd kernel-source
          echo "CONFIG_KSU=y" >> arch/arm64/configs/surya-perf_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/surya-perf_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/surya-perf_defconfig

      - name: Proses Masak Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Masukkan AOSP Clang ke dalam sistem path
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          
          # Konfigurasi defconfig Poco X3 NFC
          make O=out ARCH=arm64 surya-perf_defconfig
          
          # Proses compile utama menggunakan AOSP Clang
          make O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j$(nproc --all)

      - name: Ambil Hasil Jadi (Image.gz-dtb)
        uses: actions/upload-artifact@v4
        with:
          name: Strombreaker-Surya-KSUNext
          path: |
            kernel-source/out/arch/arm64/boot/Image.gz-dtb
            kernel-source/out/arch/arm64/boot/Image.gz
            kernel-source/out/arch/arm64/boot/Image
