name: Build Strombreaker KSU Next Surya
on:
  push:
    branches: [ "Sbv8ksun" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Alat Kerja
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev clang lld git rsync

      - name: Download Azure Clang (Toolchain Anti-Gagal)
        run: |
          mkdir -p $GITHUB_WORKSPACE/azure-clang
          git clone --depth=1 https://github.com/P some-guy/azure-clang.git $GITHUB_WORKSPACE/azure-clang
          # NB: Jika link di atas ada kendala, repo di bawah ini adalah alternatif tercepat
          rm -rf $GITHUB_WORKSPACE/azure-clang
          git clone --depth=1 https://gitlab.com/ZyCros/ZyCros-Clang.git $GITHUB_WORKSPACE/azure-clang

      - name: Ambil Source Strombreaker Lo
        run: |
          git clone --depth=1 https://github.com/kiwan5181-ops/Sbv8ksun.git -b Sbv8ksun kernel-source

      - name: Pasang KernelSU Next Manual-Otomatis
        run: |
          cd kernel-source
          git submodule add https://github.com/rifsxd/KernelSU-Next.git KernelSU-Next
          echo "obj-y += KernelSU-Next/kernel/" >> drivers/Makefile

      - name: Aktifkan KSU Next ke Surya Defconfig
        run: |
          cd kernel-source
          echo "CONFIG_KSU=y" >> arch/arm64/configs/surya-perf_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/surya-perf_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/surya-perf_defconfig

      - name: Proses Masak Pake Script Dev Sbv8 + Clang
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          # Masukkan compiler baru ke jalur sistem agar build.sh mendeteksi perintah clang
          export PATH="$GITHUB_WORKSPACE/azure-clang/bin:$PATH"
          chmod +x build.sh
          ./build.sh

      - name: Ambil Hasil Jadi (Image.gz)
        uses: actions/upload-artifact@v4
        with:
          name: Strombreaker-Surya-KSUNext
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
