name: Build Strombreaker KSU Next Surya
on:
  push:
    branches: [ "Sbv8ksun" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Alat Kerja
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex libelf-dev clang lld git rsync wget

      - name: Download AOSP Clang Bawaan Google
        run: |
          mkdir -p $GITHUB_WORKSPACE/aosp-clang
          cd $GITHUB_WORKSPACE/aosp-clang
          # Download AOSP Clang r488109 (Versi stabil untuk kernel 4.14/4.19)
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r488109.tar.gz
          tar -xf clang-r488109.tar.gz
          rm clang-r488109.tar.gz

      - name: Ambil Source Strombreaker Lo
        run: |
          git clone --depth=1 https://github.com/kiwan5181-ops/Sbv8ksun.git -b Sbv8ksun kernel-source

      - name: Pasang KernelSU Next Manual-Otomatis
        run: |
          cd kernel-source
          git submodule add https://github.com/rifsxd/KernelSU-Next.git KernelSU-Next
          echo "obj-y += KernelSU-Next/kernel/" >> drivers/Makefile

      - name: Aktifkan KSU Next ke Surya Defconfig
        run: |
          cd kernel-source
          echo "CONFIG_KSU=y" >> arch/arm64/configs/surya-perf_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/surya-perf_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/surya-perf_defconfig

      - name: Proses Masak Pake Script Dev Sbv8 + AOSP Clang
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          # Masukkan AOSP Clang ke jalur sistem biar build.sh bisa baca
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          chmod +x build.sh
          ./build.sh

      - name: Ambil Hasil Jadi (Image.gz)
        uses: actions/upload-artifact@v4
        with:
          name: Strombreaker-Surya-KSUNext
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
