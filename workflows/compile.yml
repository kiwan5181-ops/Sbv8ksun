
name: Compile KernelSU Next Poco X3 NFC (SBV8)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Paket Pendukung
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libssl-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5-dev bison flex libelf-dev

    - name: Download Proton Clang
      run: |
        mkdir clang
        cd clang
        curl -LO https://googlesource.com
        tar -xf clang-r522817.tar.gz

    - name: Inject KernelSU Next
      run: |
        curl -LSs "https://githubusercontent.com" | bash -s main

    - name: Edit Defconfig untuk KSU Next
      run: |
        # Mencari file defconfig surya di branch sbv8 secara otomatis
        DEFCONFIG="arch/arm64/configs/vendor/surya_defconfig"
        if [ ! -f "$DEFCONFIG" ]; then
          DEFCONFIG="arch/arm64/configs/surya_defconfig"
        fi
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_KSU_NEXT=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

    - name: Mulai Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$(pwd)/clang/bin:$PATH"
        
        if [ -f "arch/arm64/configs/vendor/surya_defconfig" ]; then
          make O=out vendor/surya_defconfig
        else
          make O=out surya_defconfig
        fi
        
        make -j$(nproc --all) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Packing dengan AnyKernel3
      run: |
        git clone https://github.com
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../KernelSU_Next_Stormbreaker_Surya.zip *

    - name: Upload Hasil Kernel
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-PocoX3-SBV8
        path: KernelSU_Next_Stormbreaker_Surya.zip
